# Сверка контрактов CD vs SAP (main + add contract)
ignore_chars: " -–—"           # какие символы не учитывать при сравнении (пробелы — всегда)
glued_contracts: true          # «склеенный» контракт (A/B, A-B из двух номеров) делить на части
main_only_match: review        # совпал только основной контракт без доп. соглашения: review | ok | issue
# Кириллица и латиница одинакового вида (С/C, Х/X, А/A, В/B, Р/P …) считаются одной буквой всегда.
