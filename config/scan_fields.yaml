# ================================================================
# Паттерны извлечения полей из OCR-текста сканированных деклараций.
# Формат: список regex; первое совпадение побеждает.
# Группа захвата (…) — само значение поля.
# Можно добавлять свои паттерны (RU/EN/ZH) без изменения кода.
# ================================================================
fields:
  decl_ru:                       # номер ДТ РФ: таможня (8) / дата ДДММГГ (6) / номер (7)
    - '(\d{8}\s*/\s*\d{6}\s*/\s*[A-ZА-Я]?\d{7})'
  decl_num:                      # номер 报关单 КНР: 18 цифр
    - '(?:declaration\s*(?:no\.?|number)|customs\s*decl\w*)[ №:\-]*(\d{18})'
    - '(?:报关\s*单\s*号|海关\s*编号)[ №:\-：:]*(\d{18})'
    - '(?<![\d/])(\d{18})(?![\d/])'
  container_num:
    - '\b([A-ZА-Я]{4}\s?\d{7})\b'
  contract:
    - '(?:контракт|contract|合\s*同\s*号?)\s*(?:№|no\.?|N[°º])?\s*[:\-：]?\s*([A-ZА-ЯЁA-Z0-9\.\-_/]{4,40})'
  incoterms:
    - '\b(CIF|C&F|CFR|FOB|C&I|EXW|DAP|DDP|FCA|CPT|CIP|FAS|DPU)\b'
    - '(?:условия\s*поставки|terms\s*of\s*delivery|incoterms?|贸易术语|成交方式)\s*[:\-：]?\s*([A-Z&А-ЯЁ]{2,5})'
  hs_code:
    - '(?:код\s*ТН\s*ВЭД|код\s*TH\s*ВЭД|товарная\s*позиция)[ №:\-：:]*(\d[\d\s]{7,11}\d)'
    - '(?:HS\s*code|commodity\s*code)[ №:\-：:]*(\d[\d\s]{7,11}\d)'
    - '(?:商\s*品\s*编\s*码|税\s*则\s*号\s*列)[ №:\-：:]*(\d[\d\s]{7,11}\d)'
  unit_price:
    - '(?:цена\s*за\s*единиц\w*|цена)[ №:\-：:]*([\d\s]{1,12}[,\.]\d{1,4})'
    - '(?:unit\s*price|price)[ №:\-：:]*([\d\s]{1,12}[,\.]\d{1,4})'
    - '(?:单\s*价)[ №:\-：:]*([\d\s]{1,12}[,\.]\d{1,4})'
  net_weight:
    - '(?:вес\s*нетто)[ №:\-：:]*([\d\s]{1,12}[,\.]?\d{0,3})'
    - '(?:net\s*weight)[ №:\-：:]*([\d\s]{1,12}[,\.]?\d{0,3})'
    - '(?:净\s*重)[ №:\-：:]*([\d\s]{1,12}[,\.]?\d{0,3})'
  declared_model:
    - '(?:модель|заявленная\s*модель)[ №:\-：:]*([A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9\.\-_/ ]{1,40})'
    - '(?:model|规\s*格\s*型\s*号|型\s*号)[ №:\-：:]*([A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9\.\-_/ ]{1,40})'

# ================================================================
# Исправления типовых OCR-прочтений (после транслитерации
# кириллических омоглифов в латиницу). Маппить можно только токены,
# которые сами НЕ являются валидным значением поля.
# ================================================================
ocr_fixes:
  incoterms:
    CE: CIF      # «CIF» прочитан с пропуском среднего штриха
    C1F: CIF
    CLF: CIF
    F0B: FOB
    FO8: FOB
    FOE: FOB
    CFK: CFR
    CKR: CFR
    EXY: EXW
    EXV: EXW
    ECA: FCA     # «F» прочитан как «E»
    FGA: FCA
    CPI: CPT
    GPT: CPT
