<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SibDoc · PostControl Suite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A56DB'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --blue:#1A56DB; --blue-d:#1242a8; --bg:#f4f6fa; --card:#fff; --line:#e3e8f0;
    --ok:#0a7a30; --ok-bg:#c6efce; --issue:#b00020; --issue-bg:#ffc7ce;
    --review:#8a6100; --review-bg:#ffeb9c; --skip:#555; --skip-bg:#d9d9d9;
    --warn-bg:#ffeb9c; --info-bg:#ddebf7; --text:#1c2333; --muted:#667085;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{background:var(--blue);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header h1{font-size:18px;font-weight:700}
  header .sub{opacity:.85;font-size:12px}
  header .spacer{flex:1}
  .mode{background:#ffffff22;border:1px solid #ffffff55;border-radius:8px;padding:4px 10px;font-size:12px}
  .lang{display:flex;gap:4px}
  .lang button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
  .lang button.active{background:#fff;color:var(--blue)}
  nav.toc{background:#fff;border-bottom:1px solid var(--line);padding:8px 24px;display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:52px;z-index:19}
  nav.toc a{color:var(--blue-d);text-decoration:none;font-size:12.5px;padding:4px 10px;border-radius:6px}
  nav.toc a:hover{background:#eef4ff}
  .wrap{max-width:1320px;margin:0 auto;padding:20px 24px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px;scroll-margin-top:110px}
  .card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3{font-size:13px;margin:10px 0 6px;color:var(--blue-d)}
  .step{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .slot{border:2px dashed var(--line);border-radius:8px;padding:12px;transition:.15s}
  .slot.loaded{border-style:solid;border-color:var(--ok-bg);background:#f4fbf5}
  .slot .lab{font-weight:600;font-size:13px;margin-bottom:4px}
  .slot .meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .slot .how{font-size:11.5px;color:var(--muted);margin:4px 0 6px}
  .slot input[type=file]{font-size:12px;width:100%}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .b-req{background:#ffe3e6;color:#a3001e} .b-opt{background:#e8edf5;color:#445}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-builtin{background:#e5e0f5;color:#5a3fa8}
  .b-wait{background:#fff1d6;color:#8a5a00} .b-multi{background:#e0f2fe;color:#075985}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--blue-d)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .btn.sm{padding:5px 11px;font-size:12.5px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stat{flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:center}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .n-ok{color:var(--ok)} .n-issue{color:var(--issue)} .n-review{color:var(--review)} .n-dq{color:#b3541e}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  th{background:var(--blue);color:#fff;position:sticky;top:0;font-weight:600}
  th small{display:block;font-weight:400;opacity:.85}
  tr:nth-child(even) td{background:#f7f9fc}
  .st{font-weight:700;padding:1px 7px;border-radius:9px;font-size:11px;white-space:nowrap}
  .st-OK{background:var(--ok-bg);color:var(--ok)} .st-ISSUE{background:var(--issue-bg);color:var(--issue)}
  .st-REVIEW{background:var(--review-bg);color:var(--review)} .st-SKIPPED{background:var(--skip-bg);color:var(--skip)}
  .st-ERROR{background:var(--issue-bg);color:var(--issue)} .st-WARNING{background:var(--warn-bg);color:var(--review)}
  .st-INFO{background:var(--info-bg);color:#1f4e79}
  .st-found{background:var(--ok-bg);color:var(--ok)} .st-missing{background:var(--issue-bg);color:var(--issue)}
  .st-review{background:var(--review-bg);color:var(--review)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tab{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12.5px}
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .tbl-wrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .muted{color:var(--muted);font-size:12px}
  textarea{width:100%;min-height:200px;font-family:Consolas,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:10px}
  select,input.inp{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px;background:#fff}
  .hidden{display:none !important}
  .scan-drop{border:2px dashed var(--blue);border-radius:8px;padding:16px;text-align:center;background:#f8faff;cursor:pointer}
  .scan-drop:hover{background:#eef4ff}
  .scan-file{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .scan-file h4{font-size:13px;margin-bottom:6px}
  .scan-file .excerpt{font-family:Consolas,monospace;font-size:11px;color:#556;background:#f6f8fb;border-radius:6px;padding:6px;margin-top:6px;white-space:pre-wrap;max-height:90px;overflow:auto}
  .fld{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;font-size:12px;border:1px solid var(--line)}
  .fld-found{background:var(--ok-bg)} .fld-review{background:var(--review-bg)} .fld-missing{background:var(--issue-bg)}
  #toast{position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;font-size:13px;z-index:60;max-width:520px}
  .conn{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fbfcfe}
  .conn .det{font-size:12px;color:var(--muted);margin-top:4px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;min-width:300px}
  .cal .hd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
  .cal .d{border:1px solid var(--line);border-radius:6px;padding:5px 2px;text-align:center;cursor:pointer;font-size:12px;min-height:38px;background:#fff}
  .cal .d:hover{background:#eef4ff}
  .cal .d.sel{background:var(--blue);color:#fff}
  .cal .d.off{opacity:.3;cursor:default;border-style:dashed}
  .cal .cnt{display:block;font-size:10px;color:var(--blue-d);margin-top:2px}
  .cal .d.sel .cnt{color:#fff}
  .jsearch{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
  .decl{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .decl .dh{background:#eef2ff;padding:8px 12px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0;border-top:1px solid var(--line)}
  .kv div{padding:6px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
  .kv b{display:block;font-size:11px;color:var(--muted);font-weight:600}
  .kv b small{font-weight:400;margin-left:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  .form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .form .inp{width:110px}
  #modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50}
  #modal .box{background:#fff;border-radius:12px;width:min(1200px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
  #modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  #modal .mb{padding:12px 16px;overflow:auto}
  .note{background:#f8faff;border:1px solid #dbe5ff;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#334}
</style>
</head>
<body>
<header>
  <h1>SibDoc</h1>
  <span class="sub" data-i18n="tagline"></span>
  <span class="spacer"></span>
  <span class="mode hidden" id="modeChip" data-i18n="proto_mode"></span>
  <div class="mode hidden" id="userChip"><span id="userName"></span> <button class="btn sm ghost" onclick="logout()" data-i18n="logout"></button></div>
  <div class="lang">
    <button data-lang="ru" onclick="setLang('ru')">RU</button>
    <button data-lang="en" onclick="setLang('en')">EN</button>
    <button data-lang="zh" onclick="setLang('zh')">中文</button>
  </div>
</header>
<nav class="toc">
  <a href="#c-data" data-i18n="nav_data"></a><a href="#c-decl" data-i18n="nav_decl"></a>
  <a href="#c-scan" data-i18n="nav_scan"></a><a href="#c-rates" data-i18n="nav_rates"></a>
  <a href="#c-rules" data-i18n="nav_rules"></a><a href="#c-run" data-i18n="nav_run"></a>
  <a href="#c-journal" data-i18n="nav_journal"></a><a href="#c-conn" data-i18n="nav_conn"></a>
</nav>
<div class="wrap">

  <div class="card" id="c-data">
    <h2><span class="step">1</span> <span data-i18n="step1"></span></h2>
    <p class="muted" style="margin-bottom:10px" data-i18n="step1_hint"></p>
    <div class="slots" id="slots"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" onclick="reloadData()" data-i18n="reload_btn"></button>
      <span class="muted" id="reloadInfo"></span>
    </div>
    <p class="muted" style="margin-top:8px" data-i18n="builtin_note"></p>
  </div>

  <div class="card" id="c-decl">
    <h2><span class="step">2</span> <span data-i18n="decl_title"></span></h2>
    <div class="row" style="margin-bottom:10px">
      <div class="tabs" style="margin:0">
        <button class="tab active" id="dt_ru" onclick="declSlot='ru_dt';renderDecl()" data-i18n="decl_ru_tab"></button>
        <button class="tab" id="dt_cn" onclick="declSlot='cn_dec';renderDecl()" data-i18n="decl_cn_tab"></button>
      </div>
      <input class="jsearch" id="declSearch" oninput="renderDecl(true)" data-i18n-ph="decl_search">
    </div>
    <div id="declBox"></div>
  </div>

  <div class="card" id="c-scan">
    <h2><span class="step">3</span> <span data-i18n="scan_title"></span></h2>
    <p class="muted" style="margin-bottom:10px" data-i18n="scan_hint"></p>
    <div class="row">
      <div class="scan-drop" style="flex:1" onclick="document.getElementById('scanInput').click()">
        <span data-i18n="scan_drop"></span>
        <input type="file" id="scanInput" multiple accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.bmp" style="display:none">
      </div>
      <button class="btn ghost" onclick="uploadScans()" data-i18n="scan_upload_btn"></button>
      <button class="btn ghost" onclick="scansToSource()" data-i18n="scan_to_src"></button>
      <button class="btn ghost" onclick="clearScans()" data-i18n="scan_clear_btn"></button>
      <a class="btn ghost hidden" id="scanExcel" href="/api/scans/excel" data-i18n="scan_excel_btn"></a>
    </div>
    <div id="scanList" style="margin-top:12px"></div>
    <div id="scanPreviewWrap" class="hidden" style="margin-top:12px">
      <h3 data-i18n="scan_preview_title"></h3>
      <div class="tbl-wrap"><table id="scanPreview"></table></div>
    </div>
  </div>

  <div class="card" id="c-rates">
    <h2><span class="step">4</span> <span data-i18n="rates_title"></span></h2>
    <p class="muted" style="margin-bottom:10px" data-i18n="rates_hint"></p>
    <div class="row" style="margin-bottom:10px">
      <label class="muted" data-i18n="rates_date"></label>
      <input type="date" class="inp" id="rDate" onchange="renderRates()">
      <label class="muted" data-i18n="rates_mode"></label>
      <select id="rMode" onchange="saveRateMode()">
        <option value="official" data-i18n="mode_official"></option>
        <option value="manual_override" data-i18n="mode_manual"></option>
      </select>
      <button class="btn ghost sm" onclick="refreshRates('cbr')" data-i18n="rates_get_cbr"></button>
      <button class="btn ghost sm" onclick="refreshRates('cfets')" data-i18n="rates_get_cfets"></button>
    </div>
    <div class="grid2">
      <div>
        <h3 data-i18n="rates_table"></h3>
        <div class="tbl-wrap" style="max-height:340px"><table id="rTbl"></table></div>
      </div>
      <div>
        <h3 data-i18n="rates_manual"></h3>
        <div class="form" style="margin-bottom:8px">
          <span>1</span><input class="inp" id="mBase" placeholder="USD" style="width:70px">
          <span>=</span><input class="inp" id="mVal" placeholder="7.12" style="width:90px">
          <input class="inp" id="mQuote" placeholder="CNY" style="width:70px">
          <input type="date" class="inp" id="mDate" style="width:140px">
          <span class="muted" data-i18n="or_month"></span>
          <input type="month" class="inp" id="mMonth" style="width:140px">
          <select id="mScope"><option value="any" data-i18n="scope_any"></option><option value="cbr">ЦБ РФ (cbr)</option>
            <option value="cfets">CFETS / 中间价</option><option value="china_customs" data-i18n="scope_cn_customs"></option></select>
          <input class="inp" id="mComment" data-i18n-ph="comment" style="width:180px">
          <button class="btn sm" onclick="addManualRate()" data-i18n="add"></button>
        </div>
        <div class="tbl-wrap" style="max-height:260px"><table id="mTbl"></table></div>
      </div>
    </div>
  </div>

  <div class="card" id="c-rules">
    <h2><span class="step">5</span> <span data-i18n="step2"></span> <span class="muted" data-i18n="step2_note"></span></h2>
    <div class="row">
      <select id="ruleSel" onchange="loadRule()"></select>
      <button class="btn ghost sm" onclick="loadRule()" data-i18n="load_btn"></button>
      <button class="btn sm" onclick="saveRule()" data-i18n="save_btn"></button>
      <span class="muted" id="ruleInfo"></span>
    </div>
    <div style="margin-top:10px"><textarea id="ruleText" data-i18n-ph="rule_ph"></textarea></div>
    <h3 data-i18n="rule_history"></h3>
    <div class="tbl-wrap" style="max-height:200px"><table id="ruleHist"></table></div>
  </div>

  <div class="card" id="c-run">
    <h2><span class="step">6</span> <span data-i18n="step3"></span></h2>
    <div class="row">
      <button class="btn" id="runBtn" onclick="runAll()" data-i18n="run_btn"></button>
      <a class="btn ghost hidden" id="dlExcel" data-i18n="dl_excel"></a>
      <a class="btn ghost hidden" id="dlPdf" data-i18n="dl_pdf"></a>
      <span class="muted" id="runInfo"></span>
    </div>
    <h3 data-i18n="runs_title"></h3>
    <div class="tbl-wrap" style="max-height:220px"><table id="runsTbl"></table></div>
  </div>

  <div class="card hidden" id="sumCard">
    <h2 data-i18n="summary"></h2>
    <div class="row" id="stats"></div>
    <div style="margin-top:14px" class="tbl-wrap"><table id="sumTbl"></table></div>
    <div id="ratesUsed" class="note hidden" style="margin-top:10px"></div>
  </div>

  <div class="card hidden" id="dqCard">
    <h2 data-i18n="dq_title"></h2>
    <div id="dqBody"></div>
  </div>

  <div class="card hidden" id="resCard">
    <h2 data-i18n="results"></h2>
    <div class="row" style="margin-bottom:8px">
      <div class="tabs" id="tabs" style="margin:0"></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <select id="stFilter" onchange="renderTab()">
        <option value="" data-i18n="all_statuses"></option><option>ISSUE</option><option>REVIEW</option><option>OK</option><option>SKIPPED</option>
      </select>
      <input class="jsearch" id="resSearch" oninput="renderTab()" data-i18n-ph="res_search">
    </div>
    <div id="checkNote" class="muted" style="margin-bottom:6px"></div>
    <div class="tbl-wrap"><table id="resTbl"></table></div>
  </div>

  <div class="card" id="c-journal">
    <h2 data-i18n="journal_title"></h2>
    <div class="row" style="margin-bottom:10px">
      <button class="btn ghost sm" onclick="calMove(-1)">&#8249;</button>
      <b id="calTitle"></b>
      <button class="btn ghost sm" onclick="calMove(1)">&#8250;</button>
      <select id="jKind" onchange="renderJournal()"></select>
      <input type="text" id="jSearch" class="jsearch" oninput="renderJournal()" data-i18n-ph="journal_search">
      <button class="btn ghost sm" onclick="journalClearDay()" data-i18n="journal_all"></button>
      <a class="btn ghost sm" id="jExport" data-i18n="journal_export"></a>
    </div>
    <div class="row" style="align-items:flex-start">
      <div class="cal" id="cal"></div>
      <div style="flex:1;min-width:380px" class="tbl-wrap"><table id="jTbl"></table></div>
    </div>
  </div>

  <div class="card" id="c-conn">
    <h2 data-i18n="conn_title"></h2>
    <p class="muted" style="margin-bottom:10px" data-i18n="conn_hint"></p>
    <h3 data-i18n="conn_ready"></h3><div id="connReady"></div>
    <h3 data-i18n="conn_wait"></h3><div id="connWait"></div>
    <h3 data-i18n="notif_title"></h3><div id="notifBox"></div>
  </div>

  <div class="card hidden" id="usersCard">
    <h2 data-i18n="users_title"></h2>
    <div class="row" style="margin-bottom:10px">
      <input id="uLogin" data-i18n-ph="users_login" class="jsearch" style="min-width:140px;flex:none">
      <input id="uPass" type="password" data-i18n-ph="users_pass" class="jsearch" style="min-width:140px;flex:none">
      <select id="uRole"><option value="operator">operator</option><option value="admin">admin</option></select>
      <button class="btn ghost" onclick="addUser()" data-i18n="users_add"></button>
    </div>
    <div class="tbl-wrap"><table id="uTbl"></table></div>
  </div>

</div>
<div id="modal" class="hidden"><div class="box"><div class="mh"><b id="mTitle"></b><span class="spacer" style="flex:1"></span>
  <button class="btn ghost sm" onclick="closeModal()" data-i18n="close"></button></div><div class="mb" id="mBody"></div></div></div>
<div id="toast"></div>

<script>
// ============================== i18n ==============================
const I18N = {
  ru: {
    tagline:"пост-контроль деклараций: 报关单 КНР · ДТ РФ · SAP", proto_mode:"Прототип: вход отключён",
    nav_data:"Данные", nav_decl:"ДТ и 报关单", nav_scan:"Сканы", nav_rates:"Курсы валют", nav_rules:"Параметры", nav_run:"Проверка и отчёты", nav_journal:"Журнал", nav_conn:"Коннекторы",
    step1:"Загрузка данных", step1_hint:"Excel (.xlsx/.xls), CSV в любой кодировке (UTF-8, Windows-1251, GBK), XML деклараций (ДТ ФТС, 报关单) и ZIP с несколькими файлами. Колонки с русскими, китайскими или английскими названиями распознаются по единому словарю.",
    builtin_note:"Справочники HS-кодов и элементов декларации подставляются автоматически, если не загружены свои.",

let LANG = (()=>{ try { return localStorage.getItem("pcs_lang") || "ru"; } catch(e){ return "ru"; } })();
const T = k => (I18N[LANG] && I18N[LANG][k]) || I18N.ru[k] || k;
let LABELS = {checks:{}, status:{}, columns:{}}, CFG = null, ME = null;

function setLang(l){
  LANG = l; try { localStorage.setItem("pcs_lang", l); } catch(e){}
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T(el.dataset.i18nPh));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === l));
  refreshAll();
}

// ============================== helpers ==============================
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(()=>t.style.opacity=0, 3200); };
async function api(url, opt){
  const r = await fetch(url, opt);
  let d = null; try { d = await r.json(); } catch(e){}
  if(!r.ok) throw new Error((d && d.detail) || r.status);
  return d;
}
const colLabel = (c) => { if(c && typeof c === 'object'){ return LANG === 'zh' ? (c.label_zh || c.key) : LANG === 'en' ? c.key : (c.label_ru || c.key); }
  const L = LABELS.columns[c]; return L ? (LANG === 'zh' ? L.zh : LANG === 'en' ? c : L.ru) : c; };
const checkTitle = (cid, fallback) => { const c = LABELS.checks[cid]; return c ? (c[LANG] || c.ru) : (fallback || cid); };
const stCell = v => `<span class="st st-${esc(v)}">${esc(v)}</span>`;
function openModal(title, html){ document.getElementById('mTitle').textContent = title; document.getElementById('mBody').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

async function refreshAll(){
  try {
    [CFG, LABELS] = await Promise.all([api('/api/config'), api('/api/labels')]);
  } catch(e){ toast('API: ' + e.message); return; }
  document.getElementById('modeChip').classList.toggle('hidden', !CFG.auth_disabled);
  await Promise.all([renderSlots(), renderRules(), renderDecl(), renderRates(), renderManual(), renderRuns(),
                     renderConnectors(), renderKinds().then(()=>{ renderCalendar(); renderJournal(); }), renderScanPreview()]);
  if(lastRun) renderResults(lastRun);
}

// ============================== data ==============================
async function renderSlots(){
  const sources = await api('/api/sources');
  const box = document.getElementById('slots');
  const accept = (CFG.accepted || ['.xlsx','.xls','.csv']).join(',');
  box.innerHTML = sources.map(s => {
    const parts = (s.parts || []).slice(0, 3).map(p => [p.format, p.sheet ? '«' + p.sheet + '»' : '', p.encoding, p.delimiter ? 'sep ' + p.delimiter : '', p.profile].filter(Boolean).join(' · ')).filter(Boolean);
    return `<div class="slot ${s.loaded ? 'loaded' : ''}">
      <div class="lab">${esc((LANG === 'zh' && s.label_zh) || (LANG === 'en' && s.label_en) || s.label)}</div>
      <div class="meta">
        ${s.required ? `<span class="badge b-req">${T('required')}</span>` : `<span class="badge b-opt">${T('optional')}</span>`}
        ${s.multi ? `<span class="badge b-multi">${T('multi')}</span>` : ''}
        ${s.builtin && !s.loaded ? '<span class="badge b-builtin">builtin</span>' : ''}
        ${s.loaded ? `<span class="badge b-ok">${T('loaded_f')}: ${s.rows} ${T('rows')} · ${s.columns} ${T('cols')}</span>` : ''}
      </div>
      ${s.loaded ? `<div class="how">${esc(s.file)}${(s.files||[]).length > 1 ? ' · ' + s.files.length + ' ' + T('files') : ''}${parts.length ? '<br>' + esc(parts.join(' | ')) : ''}${(s.mapped||[]).length ? '<br>' + T('mapped') + ': ' + s.mapped.length : ''}${(s.warnings||[]).map(w => '<br>⚠ ' + esc(w)).join('')}</div>` : ''}
      <div class="row">
        <input type="file" id="f_${s.slot}" accept="${accept}" ${s.multi ? 'multiple' : ''}>
        ${s.multi && s.loaded ? `<label class="muted"><input type="checkbox" id="a_${s.slot}"> ${T('append')}</label>` : ''}
        <button class="btn ghost sm" onclick="uploadFile('${s.slot}', ${s.multi})">${T('upload')}</button>
        ${s.loaded ? `<button class="btn ghost sm" onclick="previewSource('${s.slot}')">${T('view')}</button>
        <button class="btn ghost sm" onclick="clearSlot('${s.slot}')">${T('clear')}</button>` : ''}
      </div></div>`; }).join('');
}

async function uploadFile(slot, multi){
  const inp = document.getElementById('f_' + slot);
  if(!inp.files.length){ toast(T('pick_file')); return; }
  const fd = new FormData();
  for(const f of inp.files) fd.append('files', f);
  const ap = document.getElementById('a_' + slot);
  try {
    const d = await api('/api/upload/' + slot + (ap && ap.checked ? '?append=true' : ''), {method:'POST', body:fd});
    toast(`${T('uploaded')}: ${d.rows} ${T('rows')}` + ((d.info.warnings||[]).length ? ' · ⚠ ' + d.info.warnings.join('; ') : ''));
  } catch(e){ toast('⚠ ' + e.message); return; }
  renderSlots(); renderDecl(); renderJournal();
}
async function clearSlot(slot){ await api('/api/upload/' + slot, {method:'DELETE'}); renderSlots(); renderDecl(); renderJournal(); }

async function previewSource(slot){
  const d = await api('/api/sources/' + slot + '/preview?limit=300&lang=' + LANG);
  const head = '<tr>' + d.columns.map(c => `<th>${esc(LANG === 'zh' ? c.label_zh : LANG === 'en' ? c.key : c.label_ru)}${c.field && c.key !== c.label_ru ? `<small>${esc(c.key)}</small>` : ''}</th>`).join('') + '</tr>';
  const body = d.rows.map(r => '<tr>' + d.columns.map(c => `<td>${esc(r[c.key])}</td>`).join('') + '</tr>').join('');
  openModal(`${d.file} · ${d.rows_total} ${T('rows')}`, `<div class="tbl-wrap" style="max-height:70vh"><table>${head}${body}</table></div>`);
}

async function reloadData(){
  const info = document.getElementById('reloadInfo');
  info.textContent = T('reloading');
  try {
    const d = await api('/api/reload', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{"pull":true}'});
    toast(T('reload_done') + ': ' + (d.restored || []).length + ((d.errors || []).length ? ' · ⚠ ' + d.errors.join('; ') : ''));
  } catch(e){ toast(T('reload_err') + ': ' + e.message); }
  info.textContent = '';
  renderSlots(); renderDecl(); renderJournal();
}

let declSlot = 'ru_dt', declCache = {};
async function renderDecl(fromSearch){
  document.getElementById('dt_ru').classList.toggle('active', declSlot === 'ru_dt');

  const box = document.getElementById('declBox');
  if(!d.declarations.length){ box.innerHTML = `<p class="muted">${T('decl_none')}</p>`; return; }
  const q = (document.getElementById('declSearch').value || '').toLowerCase();
  const items = d.declarations.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));
  const lab = (o) => LANG === 'zh' ? o.label_zh : LANG === 'en' ? o.key : o.label_ru;
  const lab2 = (o) => LANG === 'zh' ? o.label_ru : o.label_zh;

function toYaml(o, ind){
  ind = ind || '';
  if(Array.isArray(o)) return '[' + o.map(v => JSON.stringify(v)).join(', ') + ']';
  if(o && typeof o === 'object')
    return Object.entries(o).map(([k, v]) => (v && typeof v === 'object' && !Array.isArray(v))
      ? ind + k + ':\n' + toYaml(v, ind + '  ') : ind + k + ': ' + (Array.isArray(v) ? toYaml(v) : JSON.stringify(v))).join('\n');
  return ind + String(o);
}
// простой YAML: ключ: значение, вложенность отступами, списки [..] в JSON-виде
function parseYaml(txt){
  try { return JSON.parse(txt); } catch(e){}
  const root = {}, stack = [{ind:-1, obj:root}];
  for(const raw of txt.split('\n')){
    if(!raw.trim() || raw.trim().startsWith('#')) continue;
    const ind = raw.match(/^ */)[0].length;
    const m = raw.trim().match(/^("?[^":]+"?):\s*(.*)$/);
    if(!m) throw new Error('строка не распознана: ' + raw.trim());
    while(stack.length > 1 && ind <= stack[stack.length - 1].ind) stack.pop();
    const key = m[1].replace(/^"|"$/g, ''), val = m[2].replace(/\s+#.*$/, '');
    const parent = stack[stack.length - 1].obj;
    if(val === ''){ parent[key] = {}; stack.push({ind, obj: parent[key]}); continue; }
    let v; try { v = JSON.parse(val); } catch(e){ v = val.replace(/^'|'$/g, '').replace(/^"|"$/g, ''); }
    parent[key] = v;
  }
  return root;
}

  setLang(LANG);
}
async function logout(){ await fetch('/api/auth/logout', {method:'POST'}); location.reload(); }
async function renderUsers(){
  const list = await api('/api/users');
  document.getElementById('uTbl').innerHTML = `<tr><th>${T('users_login')}</th><th>${T('users_role')}</th><th>${T('col_time')}</th><th></th></tr>` +
    list.map(u => `<tr><td>${esc(u.login)}</td><td>${esc(u.role)}</td><td class="muted">${esc(u.created || '')}</td><td>` +
      (u.login !== ME.login ? `<button class="btn ghost sm" onclick="delUser('${esc(u.login)}')">${T('users_del')}</button>` : '') + '</td></tr>').join('');
}
async function addUser(){
  try { await api('/api/users', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({login: uLogin.value.trim(), password: uPass.value, role: uRole.value})}); }
  catch(e){ toast('⚠ ' + e.message); return; }
  uLogin.value = ''; uPass.value = ''; toast('✓'); renderUsers();
}
async function delUser(l){ await api('/api/users/' + encodeURIComponent(l), {method:'DELETE'}); renderUsers(); }

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
checkAuth();
</script>
</body>
</html>
