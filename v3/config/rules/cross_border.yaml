# Сквозная сверка «ДТ РФ ↔ 报关单 КНР ↔ SAP»
weight_tolerance_pct: 0.5      # допуск по весу нетто, %
weight_tolerance_kg: 1         # и/или абсолютный допуск, кг
price_tolerance_pct: 0.5       # допуск по цене за тонну после пересчёта валют, %
hs_prefix_len: 6               # сколько первых знаков кода должны совпасть (ТН ВЭД и код КНР — общая часть HS)
incoterms_mismatch: review     # ДТ и 报关单 с разными условиями поставки: review | issue
per_kg_threshold: 100          # запасное правило для цены 报关单 без единицы измерения
cn_sap_weight: true            # вес 报关单 vs SAP там, где контейнеры однозначно принадлежат одной декларации
