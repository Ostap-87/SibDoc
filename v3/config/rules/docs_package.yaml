# Пакет документов ВЭД: коммерческий инвойс, упаковочный лист, транспортный документ
# (CMR, коносамент B/L, накладная СМГС, AWB), ДТ РФ, 报关单 КНР, сертификаты
# соответствия ЕАЭС и происхождения. Каждая правка — в журнале, прежняя версия сохраняется.

# Как собирать документы в отгрузку:
#   invoice_no — по номеру инвойса (ссылка в упаковочном листе, сертификате происхождения, гр. 44 ДТ);
#   container  — по номерам контейнеров (транспортный документ, 报关单, документы без ссылки на инвойс).
# Оба ключа: сначала инвойс, затем контейнеры; отгрузки разных инвойсов по общему контейнеру не склеиваются.
group_by: [invoice_no, container]
container_match_days: 120      # повторный контейнер: документ идёт в отгрузку с ближайшей датой, не дальше N дней (0 — без ограничения)

# Комплект. Виды: invoice, packing, transport, ru_dt, cn_dec, conformity
required_docs: [invoice, packing, transport, ru_dt]   # нет документа → ISSUE
expected_docs: [cn_dec]                                # нет документа → REVIEW
not_loaded: review             # вид документа не загружен совсем: review | issue

# Допуски
weight_tolerance_pct: 0.5      # нетто: инвойс ↔ упаковочный лист, %
weight_tolerance_kg: 1         # и/или абсолютный допуск, кг
gross_tolerance_pct: 0.5       # брутто: упаковочный лист ↔ транспортный документ, инвойс ↔ уп. лист, %
gross_tolerance_kg: 1
qty_tolerance_pct: 0           # количество, %
packages_tolerance: 0          # места, штук
amount_tolerance_abs: 0.01     # сумма инвойса ↔ ДТ / 报关单 в одной валюте
amount_tolerance_pct: 0
fx_tolerance_pct: 0.5          # после пересчёта по курсу (ДТ — ЦБ РФ на дату ДТ, 报关单 — НБК на дату 报关单), %

incoterms_mismatch: issue      # разные условия поставки в инвойсе и декларации: issue | review
compare_place: false           # сверять и место поставки
reference_missing: review      # номер инвойса / накладной не найден среди документов декларации: review | issue | off

# Сертификаты
hs_prefix_len: 6               # код подходит, если код сертификата — начало кода товара или совпали первые N знаков
hs_mismatch: issue             # код сертификата не подходит к товару: issue | review
issued_after_decl: review      # сертификат выдан позже даты ДТ: review | issue | ok
missing_dates: review          # в сертификате нет дат: review | ok
origin_mismatch: issue         # страна в сертификате происхождения ≠ ДТ / 报关单: issue | review
origin_doc_types: [CO, ST-1, FORM-A, FORM-E]   # какие doc_type — сертификаты происхождения
link_by_hs: false              # без ссылок (инвойс, контейнер, номер в ДТ) привязывать сертификат к отгрузкам по коду ТН ВЭД
max_listed: 5                  # сколько позиций / контейнеров / пломб перечислять в пояснении
