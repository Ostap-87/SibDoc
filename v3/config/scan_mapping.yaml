# предварительного просмотра: лист + колонки шаблона.
# Меняется без кода: добавьте/переименуйте колонки под ваш шаблон.
# ================================================================
target:
  sheet: "SCAN_PREVIEW"
  header_row: 1
  columns:
    decl_num:       "CD number"
    container_num:  "Container number"
    contract:       "Contract"
    incoterms:      "Incoterms"
