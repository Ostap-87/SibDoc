# ----------------------------------------------------------------
# УВЕДОМЛЕНИЯ о прогонах и ошибках коннекторов (по умолчанию выключены)
# ----------------------------------------------------------------
# ----------------------------------------------------------------
# УВЕДОМЛЕНИЯ. Каналы по умолчанию выключены. События:
#   run_done — прогон завершён; issues_found — найдены расхождения;
#   connector_error — ошибка коннектора. events пусто или "*" — все.
# Ключи и токены — только через переменные окружения (*_env).
# ----------------------------------------------------------------
notifications:
  wecom_team:
    type: wecom                       # 企业微信: групповой бот
    enabled: false
    label: WeCom — группа таможни
    key_env: SIBDOC_WECOM_KEY         # key=… из адреса вебхука бота
    events: [run_done, issues_found, connector_error]
    send_files: true                  # прикладывать Excel/PDF отчёта (до 20 МБ)

  telegram_ops:
    type: telegram
    enabled: false
    label: Telegram — дежурные
    token_env: SIBDOC_TG_TOKEN
    # chat_id: "-1001234567890"
    events: [issues_found, connector_error]
    # api_url: https://api.telegram.org   # свой сервер Bot API, если telegram недоступен
    # proxy: http://proxy.example.ru:3128

  email_team:
    type: email
    enabled: false
    label: Почта — команда пост-контроля
    # host: smtp.example.ru
    # port: 465                       # 465 — SSL, 587 — STARTTLS
    # security: ssl                   # ssl | starttls
    # username: sibdoc@example.ru
    password_env: SIBDOC_SMTP_PASSWORD
    # from: "SibDoc <sibdoc@example.ru>"
    # to: ["customs-team@example.ru"]
    subject_prefix: "[SibDoc]"
    events: [run_done, issues_found]
    send_files: true

# вход без пароля (прототип). false = вход по логину/паролю
auth:
  disabled: true
