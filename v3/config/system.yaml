# ================================================================
#  PostControl Suite — системная конфигурация
#  Здесь описываются источники данных, маппинг колонок,
#  параметры проверок и секции для data-quality детекции.
#  Правила проверок, которые меняются чаще, — в config/rules/*.yaml
# ================================================================

product:
  name: "PostControl Suite"
  handbook: "Post Control Report Handbook, June 2026"

# ----------------------------------------------------------------
# ИСТОЧНИКИ ДАННЫХ (слоты загрузки)
# fields           — какое поле единого словаря (config/fields.yaml) лежит в какой
#                    колонке. Колонки с другими названиями (по-русски, по-китайски,
#                    из другой выгрузки) переименовываются в эти имена автоматически.
# canonical: true  — новые слоты: колонки называются именами полей словаря.
# units            — единицы для веса/цены источника (kg | t), чтобы сравнение
#                    было честным, а не по угаданному порогу.
# required_columns — используются DQ-детекцией: отсутствие колонки = ERROR
#                    с указанием, какая проверка пострадает.
# sheet            — (необязательно) имя листа Excel; иначе выбирается лист,
#                    где больше всего узнаваемых колонок.
# ----------------------------------------------------------------
sources:
  wide_table:
    label: "Wide table (CD data, FineBI Widetable)"
    label_en: "Wide table (CD data, FineBI Widetable)"
    label_zh: "宽表（报关单数据，FineBI）"
    required: true
    fields:
      decl_cn: decl_num
      draft_num: draft_num
      container: container_num
      item_no: products_item_number
      contract: contract
      main_contract: main_contract
      add_contract: add_contract
      material: material
      hs_code: product_code
      product_name: product_name
      decl_elements: products_specs_and_models
      qty: products_qty
      unit: products_unit
      net_weight: products_net_weight
      unit_price: products_price
      currency: products_currency
      sap_price: price
      sap_currency: currency_value
      incoterms: incoterms
      sap_incoterms: shipreport_incoterms
      extra_costs: extra_costs_value
      storage_location: storage_location
      decl_ru: gtd_full
      decl_date: declaration_dt
    units: {net_weight: kg, sap_price: t}
    sections:                       # секции/блоки данных внутри источника
      declaration: [decl_num, contract, incoterms, decl_issue_status]
      product:     [product_code, product_name, products_price, products_net_weight]
      sap_link:    [container_num, shipreport_incoterms, extra_costs_value, storage_location]
    required_columns: [decl_num, container_num, contract, incoterms,
                       shipreport_incoterms, extra_costs_value, product_code,
                       product_name, material, products_price,
                       products_net_weight, storage_location, decl_issue_status]

  purchase:
    label: "Purchase (SAP data, FineBI Purchase)"
    label_en: "Purchase (SAP data, FineBI Purchase)"
    label_zh: "采购表（SAP 数据，FineBI）"
    required: true
    fields:
      container: "Container number"
      sap_price: "Price"
      currency: "Currency"
      main_contract: "Main contract"
      add_contract: "Add contract"
      net_weight: "Net weight"
      decl_ru: "Russian export decl"
      material: "Material"
      shipment_date: "Shipment date"
    units: {net_weight: t, sap_price: t}
    sections:
      main: ["Container number", "Price", "Main contract", "Add contract",
             "Net weight", "Russian export decl"]
    required_columns: ["Container number", "Price", "Main contract",
                       "Add contract", "Net weight"]

  ru_dt:
    label: "ДТ РФ (XML ФТС из программы брокера или Excel)"
    label_en: "RU customs declarations (FCS XML or Excel)"
    label_zh: "俄罗斯报关单（海关 XML 或 Excel）"
    required: false
    canonical: true
    multi: true                     # можно загрузить сразу много файлов (одна ДТ = один XML)
    units: {net_weight: kg}
    sections:
      header: [decl_ru, decl_date, contract, currency, incoterms]
      goods:  [hs_code, net_weight, total_value, container]
    required_columns: [decl_ru]

  cn_dec:
    label: "报关单 КНР (файл китайского брокера: Excel / CSV / XML)"
    label_en: "CN customs declarations (broker Excel / CSV / XML)"
    label_zh: "中国报关单（报关行 Excel / CSV / XML）"
    required: false
    canonical: true
    multi: true
    units: {net_weight: kg}
    sections:
      header: [decl_cn, decl_date, contract, incoterms]
      goods:  [hs_code, unit_price, currency, net_weight, container]
    required_columns: [decl_cn]

  sap_vs_cd:
    label: "SAP vs CD (ручная сводная таблица)"
    label_en: "SAP vs CD (manual summary table)"
    label_zh: "SAP 与报关单对照（手工汇总表）"
    required: false
    fields: {decl_cn: decl_num}
    sections:
      main: [decl_num]
    required_columns: [decl_num]

  cd_drafts:
    label: "Черновики деклараций"
    label_en: "Declaration drafts"
    label_zh: "报关单草稿"
    required: false
    sections: {}
    required_columns: []

  hs_reference:
    label: "Справочник HS-кодов (грейд/завод/код)"
    label_en: "HS code reference (grade / plant / code)"
    label_zh: "商品编号参考表（牌号/工厂/编号）"
    required: false
    builtin: "references/hs_codes.csv"     # встроенный файл, если не загружен
    fields: {hs_code: hs_code, model: declared_model}
    sections:
      main: [hs_code]
    required_columns: [hs_code]

  cde_reference:
    label: "Справочник элементов декларации"
    label_en: "Declaration elements reference"
    label_zh: "申报要素参考表"
    required: false
    builtin: "references/declaration_elements.csv"
    fields: {material: Material, hs_code: "HS Code", model: "报关单申报型号", decl_elements: "申报要素"}
    sections: {}
    required_columns: []

# ----------------------------------------------------------------
# ПРОВЕРКИ (вкл/выкл + ссылка на файл правил)
# Параметры, которые может менять специалист без программиста, —
# в config/rules/*.yaml (редактируются также через API/UI; каждая
# правка пишется в журнал, прежняя версия сохраняется).
# ----------------------------------------------------------------
checks:
  completeness:    {enabled: true, rules: "completeness.yaml"}
  price:           {enabled: true, rules: "price.yaml"}
  hs_code:         {enabled: true, rules: "hs_code.yaml"}
  incoterms:       {enabled: true, rules: "incoterms.yaml"}
  decl_elements:   {enabled: true, rules: "decl_elements.yaml"}
  contracts:       {enabled: true, rules: "contracts.yaml"}
  cross_border:    {enabled: true, rules: "cross_border.yaml"}

# ----------------------------------------------------------------
# DATA-QUALITY ДЕТЕКЦИЯ
# ----------------------------------------------------------------
data_quality:
  enabled: true
  empty_column_threshold: 0.95     # колонка пуста, если >=95% значений пустые
  sparse_column_threshold: 0.30    # колонка "редкая", если заполнена <30%
  duplicate_key_warning: true      # предупреждать о дублях ключей (контейнер/CD)
  container_check_digit: true      # проверять контрольную цифру номера контейнера (ISO 6346)
  mixed_scripts_warning: true      # кириллица и латиница вперемешку в ключах (СХ/CX)
  numeric_columns:                 # где ожидаются числа — детектим текст/мусор
    wide_table: [products_price, products_net_weight]
    purchase: ["Price", "Net weight"]
    ru_dt: [net_weight, total_value]
    cn_dec: [net_weight, unit_price, total_value]

# ----------------------------------------------------------------
# ВЫВОД
# ----------------------------------------------------------------
output:
  dir: "storage/reports"
  excel_name: "post_control_report.xlsx"   # последний отчёт; у каждого прогона — своя копия с номером
  pdf_name: "post_control_report.pdf"
  max_examples_per_finding: 5
  keep_runs: 100                   # сколько прошлых прогонов хранить (отчёты + сводка)
  pdf_max_rows_per_check: 200      # строк на проверку в PDF (полные данные — в Excel)

# ----------------------------------------------------------------
# СЕРВЕР
# ----------------------------------------------------------------
server:
  max_upload_mb: 100               # предельный размер одного файла
  cors_origins: ["*"]              # для прототипа; в рабочей установке — адрес сервера

# ----------------------------------------------------------------
# УЧЁТНЫЕ ЗАПИСИ. По умолчанию локальный вход: admin/admin
# (смените пароль после первого входа: раздел «Пользователи»).
#
# Корпоративный вход по почте (Microsoft Entra ID / OIDC) — ВЫКЛЮЧЕН,
# готов к включению (инструкция: docs/USERS.md). Пример блока:
# auth:
#   mode: corporate_sso          # local | corporate_sso
#   provider: entra_id           # entra_id | oidc_generic
#   issuer_url: "https://login.microsoftonline.com/<tenant-id>/v2.0"
#   client_id: "..."
#   client_secret: "..."
#   redirect_uri: "https://sibdoc.example.ru/api/auth/sso/callback"
#   allowed_domain: "example.ru" # только корпоративные почты этого домена

# ----------------------------------------------------------------
# КОННЕКТОРЫ ИСТОЧНИКОВ. Кнопка «Обновить данные» опрашивает все
# enabled: true коннекторы и перечитывает файлы. По умолчанию все
# выключены. Первая очередь (почта, папка, SFTP, REST, БД, SAP) работает
# сразу после заполнения параметров; вторая (1С, ЭТРАН, Единое окно КНР,
# Kingdee, Yonyou, банк) — задел: «Проверить» отвечает, какой доступ нужен.
# Кнопка «Проверить» тестирует соединение без загрузки.
# ----------------------------------------------------------------
# ----------------------------------------------------------------
# КОННЕКТОРЫ ИСТОЧНИКОВ. Кнопка «Обновить данные» опрашивает все
# enabled: true коннекторы и перечитывает файлы. По умолчанию ВСЕ
# выключены. Первая очередь (stage: ready) работает сразу после
# заполнения параметров; вторая очередь (stage: needs_access) — задел:
# «Проверить» покажет, какой доступ и у кого нужно получить.
#
# Пароли, токены и ключи в этот файл НЕ пишем: указываем имя
# переменной окружения (<поле>_env: ИМЯ) или ${ИМЯ} внутри строки.
# Переменные задаются на сервере (.env рядом с docker-compose.yml,
# секреты Docker/systemd), в git не попадают.
#
# Слоты: wide_table, purchase, sap_vs_cd, cd_drafts, hs_reference,
# cde_reference, ru_dt (российская ДТ: XML ФТС/Excel), cn_dec
# (китайская декларация 报关单: Excel/CSV/XML брокера).
# Файл кладётся в слот по slot_rules (regex по имени, для почты —
# ещё и по отправителю) или по началу имени (slots).
# ----------------------------------------------------------------
