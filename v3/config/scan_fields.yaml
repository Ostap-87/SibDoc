# ================================================================
# Паттерны извлечения полей из OCR-текста сканированных деклараций.
# Формат: список regex; первое совпадение побеждает.
# Группа захвата (…) — само значение поля.
# Можно добавлять свои паттерны (RU/EN/ZH) без изменения кода.
# ================================================================
fields:
  decl_ru:                       # номер ДТ РФ: таможня (8) / дата ДДММГГ (6) / номер (7)
    - '(\d{8}\s*/\s*\d{6}\s*/\s*[A-ZА-Я]?\d{7})'
  decl_num:                      # номер 报关单 КНР: 18 цифр
    - '(?:declaration\s*(?:no\.?|number)|customs\s*decl\w*)[ №:\-]*(\d{18})'
    - '(?:报关\s*单\s*号|海关\s*编号)[ №:\-：:]*(\d{18})'
    - '(?<![\d/])(\d{18})(?![\d/])'
  container_num:
    - '\b([A-ZА-Я]{4}\s?\d{7})\b'
  contract:
    - '(?:контракт|contract|合\s*同\s*(?:协\s*议\s*)?号?)\s*(?:№|no\.?|N[°º])?\s*[:\-：]?\s*([A-ZА-ЯЁA-Z0-9\.\-_/]{4,40})'
  incoterms:
    - '\b(CIF|C&F|CFR|FOB|C&I|EXW|DAP|DDP|FCA|CPT|CIP|FAS|DPU)\b'
    - '(?:условия\s*поставки|terms\s*of\s*delivery|incoterms?|贸易术语|成交方式)\s*[:\-：]?\s*([A-Z&А-ЯЁ]{2,5})'
  hs_code:
    - '(?:код\s*ТН\s*ВЭД|код\s*TH\s*ВЭД|товарная\s*позиция)[ №:\-：:]*(\d[\d \t]{7,11}\d)'
    - '(?:HS\s*code|commodity\s*code)[ №:\-：:]*(\d[\d \t]{7,11}\d)'
    - '(?:商\s*品\s*编\s*[码号]|税\s*则\s*号\s*列)[ №:\-：:]*(\d[\d \t]{7,11}\d)'
  unit_price:
    - '(?:цена\s*за\s*единиц\w*|цена)[ №:\-：:]*([\d \t]{1,12}[,\.]\d{1,4})'
    - '(?:unit\s*price|price)[ №:\-：:]*([\d \t]{1,12}[,\.]\d{1,4})'
    - '(?:单\s*价)[ №:\-：:]*([\d \t]{1,12}[,\.]\d{1,4})'
  net_weight:
    - '(?:вес\s*нетто)[ №:\-：:]*([\d \t]{1,12}[,\.]?\d{0,3})'
    - '(?:net\s*weight)[ №:\-：:]*([\d \t]{1,12}[,\.]?\d{0,3})'
    - '(?:净\s*重)[ №:\-：:]*([\d \t]{1,12}[,\.]?\d{0,3})'
  declared_model:
    - '(?:модель|заявленная\s*модель)[ №:\-：:]*([A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9\.\-_/ !]{1,40})'
    - '(?:model|规\s*格\s*型\s*号|型\s*号)[ №:\-：:]*([A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9\.\-_/ !]{1,40})'

# ================================================================
# Исправления типовых OCR-прочтений (после транслитерации
# кириллических омоглифов в латиницу). Маппить можно только токены,
# которые сами НЕ являются валидным значением поля.
# ================================================================
ocr_fixes:
  incoterms:
    CE: CIF      # «CIF» прочитан с пропуском среднего штриха
    C1F: CIF
    CLF: CIF
    F0B: FOB
    FO8: FOB
    FOE: FOB
    CFK: CFR
    CKR: CFR
    EXY: EXW
    EXV: EXW
    ECA: FCA     # «F» прочитан как «E»
    FGA: FCA
    CPI: CPT
    GPT: CPT

# ================================================================
# ВЭД-пакет: документы отгрузки из PDF (текстовый слой) и сканов.
# Отдельный блок: на разбор деклараций (fields выше) не влияет.
#   detect    — как узнать вид документа по заголовку (первые строки текста);
#   doc_types — вид транспортного документа / сертификата → значение doc_type
#               (порядок важен: первое совпадение);
#   fields    — паттерны полей по видам документов; группа (…) — значение;
#   multi     — поля, где берутся все совпадения (контейнеры, пломбы, коды);
#   в номерах документов — хотя бы одна цифра (?=…\d), чтобы не взять слово заголовка.
# ================================================================
package:
  detect:
    conformity:
      - 'сертификат\s+соответствия'
      - 'декларац\w*\s+о\s+соответствии'
      - 'сертификат\w*\s+(?:о\s+)?происхождени'
      - 'certificate\s+of\s+origin'
      - '原产地证'
      - '合格证'
      - '\bform\s+[AE]\b'
      - '\bСТ-1\b'
    packing:
      - 'packing\s+list'
      - 'упаковочный\s+лист'
      - '装箱单'
    invoice:
      - 'commercial\s+invoice'
      - 'коммерческ\w+\s+инвойс'
      - '商业发票'
      - '\binvoice\b'
      - '\bинвойс\b'
      - '发票'
    transport:
      - '\bCMR\b'
      - 'bill\s+of\s+lading'
      - 'коносамент'
      - '提单'
      - '\bСМГС\b'
      - '\bSMGS\b'
      - 'накладная'
      - 'air\s*waybill'
      - 'авианакладная'
      - '运单'
  doc_types:
    transport:
      SMGS: ['\bСМГС\b', '\bSMGS\b', 'железнодорожн\w+\s+накладн', 'railway\s+bill', '国际铁路联运运单', '铁路运单']
      CMR: ['\bCMR\b', 'автомобильн\w+\s+накладн', '公路运单']
      AWB: ['air\s*waybill', 'авианакладн', '\bAWB\b', '航空运单', '空运单']
      B/L: ['bill\s+of\s+lading', 'коносамент', '提单', '\bB/?L\b', 'sea\s+waybill', '海运单']
    conformity:
      ST-1: ['\bСТ-?1\b', '\bST-?1\b']
      FORM-A: ['\bform\s*a\b', 'форма\s*a\b']
      FORM-E: ['\bform\s*e\b', 'форма\s*e\b']
      CO: ['certificate\s+of\s+origin', 'сертификат\w*\s+(?:о\s+)?происхождени', '原产地证']
      EAEU-DECL: ['декларац\w*\s+о\s+соответствии', 'declaration\s+of\s+conformity', '\bЕАЭС\s+N?\s*RU\s+Д-']
      EAEU-CERT: ['сертификат\s+соответствия', 'certificate\s+of\s+conformity', '合格证', '\bЕАЭС\s+RU\s+С-']
  multi: [container, seal_no, hs_code]
  fields:
    invoice:
      invoice_no:
        - '(?:commercial\s+)?invoice\s*(?:no\.?|number|#|№)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - '(?:инвойс|счет|счёт)\w*\s*(?:№|N|No\.?)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - '发票\s*(?:号码?|编号)\s*[:：]?\s*((?=[A-Z0-9\-/._]*\d)[A-Z0-9][A-Z0-9\-/._]{2,40})'
      invoice_date:
        - '(?:invoice\s+)?date\s*[:：]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{4}-\d{2}-\d{2})'
        - 'дата\s*(?:инвойса)?\s*[:：]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{4}-\d{2}-\d{2})'
        - '(?:发票)?日期\s*[:：]?\s*(\d{4}[-./年]\d{1,2}[-./月]\d{1,2})'
        - '\bот\s+(\d{1,2}\.\d{1,2}\.\d{4})'
      contract:
        - '(?:contract|контракт|合同)\w*\s*(?:no\.?|№|号)?\s*[:：]?\s*([A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9.\-_/]{3,40})'
      currency:
        - '(?:currency|валюта|币制|币种)\s*[:：]?\s*([A-Z]{3}|USD|CNY|RUB|EUR|人民币|美元|рубл\w*|юан\w*|доллар\w*)'
        - '(?:total|итого|всего|合计|总计)[^\n]{0,40}?\b(USD|CNY|RUB|EUR)\b'
      incoterms:
        - '(?:terms\s+of\s+delivery|delivery\s+terms|incoterms?|условия\s+поставки|базис\s+поставки|价格条款|贸易术语)\s*[:：]?\s*((?:EXW|FCA|FAS|FOB|CFR|C&F|CIF|CPT|CIP|DAP|DPU|DDP)[^\n]{0,30})'
      invoice_total:
        - '(?:total\s+amount|grand\s+total|invoice\s+total|итого\s+(?:по\s+инвойсу|к\s+оплате|сумма)|всего\s+к\s+оплате|发票总金额|总金额|合计金额)\s*[:：]?\s*(?:[A-Z]{3}\s*)?([\d  ]{1,15}[,.]?\d{0,2})'
      net_weight_total:
        - '(?:total\s+net\s+weight|net\s+weight|вес\s+нетто|нетто|净重)[^\d\n]{0,20}([\d  ]{1,12}[,.]?\d{0,3})'
      gross_weight_total:
        - '(?:total\s+gross\s+weight|gross\s+weight|вес\s+брутто|брутто|毛重)[^\d\n]{0,20}([\d  ]{1,12}[,.]?\d{0,3})'
      packages_total:
        - '(?:total\s+packages|packages|кол-во\s+мест|количество\s+мест|мест|件数)\s*[:：]?\s*(\d{1,6})\b'
      container:
        - '\b([A-Z]{4}\s?\d{7})\b'
      hs_code:
        - '(?:HS\s*code|код\s*ТН\s*ВЭД(?:\s*ЕАЭС)?|商品编码|海关编码)\s*[:：]?\s*(\d{4,10})'
      seller:
        - '(?:seller|продавец|卖方)\s*[:：]\s*([^\n]{3,80})'
      buyer:
        - '(?:buyer|покупатель|买方)\s*[:：]\s*([^\n]{3,80})'
    packing:
      packing_no:
        - 'packing\s+list\s*(?:no\.?|number|#|№)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - 'упаковочный\s+лист\s*(?:№|N|No\.?)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - '装箱单\s*(?:号|编号)\s*[:：]?\s*((?=[A-Z0-9\-/._]*\d)[A-Z0-9][A-Z0-9\-/._]{2,40})'
      invoice_no:
        - 'invoice\s*(?:no\.?|number|#|№)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - 'инвойс\w*\s*(?:№|N|No\.?)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - '发票\s*(?:号码?|编号)\s*[:：]?\s*((?=[A-Z0-9\-/._]*\d)[A-Z0-9][A-Z0-9\-/._]{2,40})'
      packing_date:
        - 'date\s*[:：]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{4}-\d{2}-\d{2})'
        - 'дата\s*[:：]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{4}-\d{2}-\d{2})'
        - '日期\s*[:：]?\s*(\d{4}[-./年]\d{1,2}[-./月]\d{1,2})'
      packages_total:
        - '(?:total\s+packages|packages|кол-во\s+мест|количество\s+мест|всего\s+мест|件数)\s*[:：]?\s*(\d{1,6})\b'
      net_weight_total:
        - '(?:total\s+net\s+weight|net\s+weight|вес\s+нетто|нетто|净重)[^\d\n]{0,20}([\d  ]{1,12}[,.]?\d{0,3})'
      gross_weight_total:
        - '(?:total\s+gross\s+weight|gross\s+weight|вес\s+брутто|брутто|毛重)[^\d\n]{0,20}([\d  ]{1,12}[,.]?\d{0,3})'
      container:
        - '\b([A-Z]{4}\s?\d{7})\b'
      seal_no:
        - '(?:seal|пломб\w*|ЗПУ|封[号志条]?\s*号?)\s*(?:no\.?|№|N)?\s*[:：]?\s*((?=[A-Z0-9\-]*\d)[A-Z0-9][A-Z0-9\-]{3,20})'
    transport:
      bill_of_lading:
        - '(?:bill\s+of\s+lading|B/L)\s*(?:no\.?|number|№)?\s*[:：]?\s*((?=[A-Z0-9\-/]*\d)[A-Z0-9][A-Z0-9\-/]{3,30})'
        - '\bCMR\s*(?:no\.?|№|N)?\s*[:：]?\s*((?=[A-ZА-Я0-9\-/]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/]{3,30})'
        - '(?:СМГС|SMGS)\s*(?:no\.?|№|N)?\s*[:：]?\s*((?=[A-ZА-Я0-9\-/]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/]{3,30})'
        - '(?:air\s*waybill|AWB)\s*(?:no\.?|№)?\s*[:：]?\s*(\d{3}-?\d{8})'
        - 'накладн\w*\s*(?:№|N|No\.?)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/]{3,30})'
        - '(?:提单号|运单号)\s*[:：]?\s*((?=[A-Z0-9\-/]*\d)[A-Z0-9][A-Z0-9\-/]{3,30})'
      transport_doc_date:
        - '(?:date\s+of\s+issue|issue\s+date|date|дата\s+(?:составления|выдачи)?|日期)\s*[:：]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{4}-\d{2}-\d{2})'
      packages_total:
        - '(?:total\s+packages|packages|кол-во\s+мест|количество\s+мест|число\s+мест|件数)\s*[:：]?\s*(\d{1,6})\b'
      gross_weight_total:
        - '(?:total\s+gross\s+weight|gross\s+weight|вес\s+брутто|брутто|масса\s+брутто|毛重)[^\d\n]{0,20}([\d  ]{1,12}[,.]?\d{0,3})'
      container:
        - '\b([A-Z]{4}\s?\d{7})\b'
      seal_no:
        - '(?:seal|пломб\w*|ЗПУ|封[号志条]?\s*号?)\s*(?:no\.?|№|N)?\s*[:：]?\s*((?=[A-Z0-9\-]*\d)[A-Z0-9][A-Z0-9\-]{3,20})'
      consignor:
        - '(?:shipper|consignor|отправитель|грузоотправитель|发货人|托运人)\s*[:：]\s*([^\n]{3,80})'
      consignee:
        - '(?:consignee|получатель|грузополучатель|收货人)\s*[:：]\s*([^\n]{3,80})'
    conformity:
      cert_no:
        - '(ЕАЭС\s+(?:N\s+)?RU\s+[CДС]-[A-ZА-Я]{2}\.[A-ZА-Я0-9.]+?/\d{2})'
        - '(?:certificate|сертификат|декларация)\w*\s*(?:no\.?|№|N|number)\s*[:：]?\s*([A-ZА-Я0-9][A-ZА-Я0-9 .\-/]{3,40}?)(?:\s{2,}|\n|$)'
        - '(?:证书编号|证书号|编号)\s*[:：]?\s*((?=[A-Z0-9\-/]*\d)[A-Z0-9][A-Z0-9\-/]{3,30})'
      issue_date:
        - '(?:дата\s+(?:выдачи|регистрации|оформления)|date\s+of\s+issue|issue\s+date|issued\s+on|签发日期|发证日期)\s*[:：]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{4}-\d{2}-\d{2}|\d{4}年\d{1,2}月\d{1,2}日)'
      expiry_date:
        - '(?:действител\w+\s+(?:по|до)|срок\s+действия\s+(?:по|до|с\s+[\d.]+\s+по)|valid\s+(?:until|till|to)|expiry\s+date|有效期至)\s*[:：]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{4}-\d{2}-\d{2}|\d{4}年\d{1,2}月\d{1,2}日)'
      hs_code:
        - '(?:HS\s*code|H\.S\.\s*code|код\s*ТН\s*ВЭД(?:\s*ЕАЭС)?|商品编码|海关编码|税则号)\s*[:：]?\s*(\d{4,10})'
      origin_country:
        - '(?:country\s+of\s+origin|страна\s+происхождения|原产国|原产地)\s*[:：]?\s*([A-Za-zА-Яа-яЁё一-鿿 ]{2,40}?)(?:\s{2,}|\n|$|[,;.])'
      model:
        - '(?:марка|модель|model|grade|型号)\s*[:：]?\s*([A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9.\-_/ ]{1,40}?)(?:\s{2,}|\n|$)'
      product_name:
        - '(?:продукция|наименование\s+товара|description\s+of\s+goods|product|商品名称|货物名称)\s*[:：]\s*([^\n]{3,120})'
      issuer:
        - '(?:орган\s+по\s+сертификации|issued\s+by|签发机构|发证机构)\s*[:：]?\s*([^\n]{3,100})'
      invoice_no:
        - 'invoice\s*(?:no\.?|number|#|№)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - 'инвойс\w*\s*(?:№|N|No\.?)\s*[:：]?\s*((?=[A-ZА-Я0-9\-/._]*\d)[A-ZА-Я0-9][A-ZА-Я0-9\-/._]{2,40})'
        - '发票\s*(?:号码?|编号)\s*[:：]?\s*((?=[A-Z0-9\-/._]*\d)[A-Z0-9][A-Z0-9\-/._]{2,40})'
