# ================================================================
#  ЕДИНЫЙ СЛОВАРЬ ПОЛЕЙ (RU / EN / ZH)
#
#  Каждое поле — одно понятие (контейнер, номер ДТ, вес нетто…) с подписями
#  на трёх языках и списком синонимов: как эту колонку называют в выгрузках
#  SAP, FineBI, программах брокеров РФ и Китая, а также теги XML ФТС
#  (ESADout_CU) и китайского 报关单 (DecHead / DecList).
#
#  Новая выгрузка с другими названиями колонок подключается добавлением
#  синонима сюда — без программиста. Сравнение названий не зависит от
#  регистра, пробелов, знаков препинания и полноширинных символов.
#
#  type: text | number | date | code | currency | unit
# ================================================================

