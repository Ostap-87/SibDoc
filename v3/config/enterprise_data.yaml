# ================================================================
#  1С: ФОРМАТ ОБМЕНА EnterpriseData (Коннекторы/банк)
#
#  Универсальный формат обмена 1С (БП 3.0, УТ 11, КА 2, ERP 2): файл
#  Message / msg:Header / Body, в Body — объекты «Документ.<Вид>» и
#  «Справочник.<Вид>». Выгружается обработкой «Синхронизация данных через
#  универсальный формат» или «Выгрузка и загрузка данных EnterpriseData»
#  (обмен через каталог / файл).
#
#  Здесь — какие объекты нужны для ВЭД и в какой слот SibDoc они идут.
#  Пути к значениям — по открытому описанию формата (ИТС, «Формат
#  EnterpriseData»); набор и имена свойств немного различаются по версиям
#  формата (1.6 … 1.20), поэтому на поле можно указать несколько путей —
#  берётся первый найденный. Путь «Контрагент//Наименование» — свойство
#  «Наименование» на любой глубине внутри «Контрагент» (ссылки в формате
#  выгружаются ключевыми свойствами объекта). Если ссылка выгружена только
#  идентификатором (Ссылка), значение подставляется из справочника, если он
#  есть в том же файле.
#
#  Не нашлось поля на реальном файле — допишите путь сюда; код менять не нужно.
# ================================================================

objects:
  # ------------------------------------------------------------ поступление (импорт: товар из Китая)
  Документ.ПоступлениеТоваровУслуг:
    slot: purchase
    title: "Поступление товаров и услуг"
    header:
      Номер документа 1С: ["КлючевыеСвойства/Номер", "Номер"]
      Shipment date: ["КлючевыеСвойства/Дата", "Дата"]
      Контрагент: ["Контрагент//НаименованиеПолное", "Контрагент//Наименование"]
      ИНН контрагента: ["Контрагент//ИНН"]
      Main contract: ["Договор//НомерДоговора", "Договор//Номер", "Договор//Наименование"]
      Дата договора: ["Договор//ДатаДоговора", "Договор//Дата"]
      Currency: ["Валюта//Код", "Валюта//Наименование", "ВалютаВзаиморасчетов//Код", "Договор//ВалютаВзаиморасчетов//Код"]
      Сумма документа: ["Сумма", "СуммаДокумента"]
    lines: ["Товары/Строка", "Услуги/Строка"]
    line_fields:
      Material: ["ДанныеНоменклатуры//Артикул", "Номенклатура//Артикул", "ДанныеНоменклатуры//КодВПрограмме",
                 "Номенклатура//КодВПрограмме", "Номенклатура//Код"]
      Номенклатура: ["ДанныеНоменклатуры//НаименованиеПолное", "ДанныеНоменклатуры//Наименование",
                     "Номенклатура//НаименованиеПолное", "Номенклатура//Наименование", "Содержание"]
      Единица: ["ЕдиницаИзмерения//Наименование", "ЕдиницаИзмерения//Код"]
      Количество: ["Количество"]
      Цена 1С: ["Цена"]
      Сумма: ["Сумма"]
      ГТД (1С): ["НомерГТД//НомерГТД", "НомерГТД//Номер", "НомерГТД"]
      Страна происхождения: ["СтранаПроисхождения//Наименование", "СтранаПроисхождения//КодКлассификатора"]

  # ------------------------------------------------------------ ГТД по импорту (ДТ РФ)
  Документ.ГТДИмпорт:
    slot: ru_dt
    title: "ГТД по импорту"
    header:
      decl_ru: ["НомерГТД//НомерГТД", "НомерГТД//Номер", "НомерДекларации", "НомерГТД"]
      decl_date: ["КлючевыеСвойства/Дата", "Дата"]
      doc_1c: ["КлючевыеСвойства/Номер", "Номер"]
      consignor: ["Контрагент//НаименованиеПолное", "Контрагент//Наименование"]
      contract: ["Договор//НомерДоговора", "Договор//Номер", "Договор//Наименование"]
      currency: ["Валюта//Код", "Валюта//Наименование", "Договор//ВалютаВзаиморасчетов//Код"]
      customs_office: ["Таможня//Наименование", "Таможня//Код"]
      procedure: ["ТаможеннаяПроцедура"]
    lines: ["РазделыГТД/Строка/Товары/Строка", "Товары/Строка"]
    line_fields:
      product_name: ["ДанныеНоменклатуры//Наименование", "Номенклатура//Наименование"]
      hs_code: ["КодТНВЭД//Код", "ДанныеНоменклатуры//КодТНВЭД//Код", "Номенклатура//КодТНВЭД//Код", "КодТНВЭД"]
      customs_value: ["ТаможеннаяСтоимость"]
      total_value: ["ФактурнаяСтоимость", "Сумма"]
      origin_country: ["СтранаПроисхождения//КодКлассификатора", "СтранаПроисхождения//Наименование"]
      qty: ["Количество"]

  # ------------------------------------------------------------ договоры и контрагенты
  Справочник.Договоры:
    slot: contract_register
    title: "Договоры"
    header:
      contract: ["КлючевыеСвойства//НомерДоговора", "КлючевыеСвойства//Номер", "НомерДоговора", "Номер",
                 "КлючевыеСвойства/Наименование", "Наименование"]
      contract_name: ["КлючевыеСвойства/Наименование", "Наименование"]
      contract_date: ["КлючевыеСвойства//ДатаДоговора", "КлючевыеСвойства/Дата", "ДатаДоговора", "Дата"]
      contract_kind: ["КлючевыеСвойства/ВидДоговора", "ВидДоговора"]
      counterparty: ["КлючевыеСвойства/Контрагент//НаименованиеПолное", "КлючевыеСвойства/Контрагент//Наименование",
                     "Контрагент//НаименованиеПолное", "Контрагент//Наименование", "Владелец//Наименование"]
      counterparty_inn: ["КлючевыеСвойства/Контрагент//ИНН", "Контрагент//ИНН", "Владелец//ИНН"]
      currency: ["КлючевыеСвойства/ВалютаВзаиморасчетов//Код", "ВалютаВзаиморасчетов//Код",
                 "ВалютаВзаиморасчетов//Наименование"]
      contract_amount: ["СуммаДоговора", "Сумма"]
      unk: ["УникальныйНомерКонтракта", "НомерПаспортаСделки", "УНК"]
    ref_index: true

  Справочник.Контрагенты:
    slot: null                     # не слот: справочник для подстановки ссылок (наименование, ИНН)
    title: "Контрагенты"
    header:
      Наименование: ["КлючевыеСвойства/НаименованиеПолное", "КлючевыеСвойства/Наименование", "Наименование"]
      ИНН: ["КлючевыеСвойства/ИНН", "ИНН"]
    ref_index: true
