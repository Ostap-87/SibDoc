# ================================================================
#  КЛАССИФИКАЦИЯ ДОКУМЕНТОВ ПАКЕТА (SibDoc 3, пакетная загрузка)
#
#  Тип каждого документа определяется по правилам — без интернета и без
#  «чёрного ящика»: у каждого найденного признака есть вес, баллы
#  складываются, побеждает тип с наибольшей суммой. В карточке документа
#  видно, какие признаки сработали («ключевое слово «packing list» +8»).
#
#  Признаки типа:
#   keywords  — слова и фразы RU / EN / ZH в тексте: {фраза: вес}.
#               Регистр, лишние пробелы и пробелы между иероглифами
#               (OCR пишет «海关 编号») не важны. «re:…» — регулярное
#               выражение. Каждая фраза считается один раз.
#   titles    — заголовки документа: ищутся в первых строках страницы /
#               листа (settings.title_lines) и в имени листа Excel. Дают
#               settings.title_weight баллов и по ним PDF из нескольких
#               документов делится на части.
#   not       — слова, которые говорят ПРОТИВ типа (вычитаются).
#   headers   — поля единого словаря (config/fields.yaml), найденные в
#               заголовке таблицы: {поле: вес}.
#   xml_roots — корневой тег XML: даёт settings.xml_weight баллов.
#   filename  — подсказки в имени файла: {фраза или re:…: вес}.
#   formats   — формат файла: {pdf|image|excel|csv|docx|xml|txt|eml|html: вес}.
#   id        — как найти номер документа (группа 1 регулярного выражения):
#               если у двух страниц подряд разные номера — это разные документы.
#
#  Порядок типов важен только при равенстве баллов.
#  Новый признак добавляется сюда — код менять не нужно. Тип, который
#  выбран неверно, поправляется вручную (API: PUT …/documents/{id}/type),
#  поля после этого извлекаются заново.
# ================================================================

settings:
  min_score: 4            # меньше — тип не определён («Прочее», статус «требует проверки»)
  strong_score: 14        # с этой суммы уверенность по «силе» признаков = 100 %
  review_below: 0.6       # уверенность ниже — статус «требует проверки»
  title_lines: 6          # сколько первых непустых строк страницы / листа считать «шапкой»
  title_weight: 5         # вес найденного заголовка
  xml_weight: 15          # вес совпавшего корневого тега XML
  keyword_cap: 30         # не больше стольких баллов от ключевых слов на тип

types:
  ru_dt:
    label: "ДТ РФ"
    label_en: "RU customs declaration (DT)"
    label_zh: "俄罗斯报关单"
    titles: ['re:декларац\w*\s+на\s+товары', "ESADout"]
    keywords:
      're:декларац\w*\s+на\s+товары': 6
      're:(?<!\d)\d{8}\s*/\s*\d{6}\s*/\s*[a-zа-я]?\d{7}(?!\d)': 5
      "таможенная стоимость": 3
      "статистическая стоимость": 3
      "декларант": 3
      're:таможенн\w+\s+процедур': 3
      're:код\s+т[нh]\s*вэд': 2
      "таможенный орган": 2
      "графа": 1
      "ESADout": 8
    not:
      "черновик": 8
      "draft": 5
      "草稿": 8
    xml_roots: [ESADout_CU, ESADout]
    headers: {decl_ru: 4, customs_value: 2, statistical_value: 2}
    filename:
      're:(^|[^a-zа-яё])(дт|gtd|esad)([^a-zа-яё]|$)': 3
    formats: {xml: 1, pdf: 1, image: 1}
    id: ['(?<!\d)(\d{8}\s*/\s*\d{6}\s*/\s*[A-ZА-Я]?\d{7})(?!\d)']

  cn_dec:
    label: "报关单 КНР"
    label_en: "CN customs declaration (报关单)"
    label_zh: "中国报关单"
    titles: ["报关单", "出口货物报关单", "进口货物报关单", "DecMessage"]
    keywords:
      "报关单": 6
      "出口货物报关单": 6
      "进口货物报关单": 6
      "中华人民共和国海关": 5
      "海关编号": 5
      "境内收发货人": 4
      "监管方式": 3
      "征免性质": 3
      "申报日期": 2
      "成交方式": 2
      "运输方式": 1
      're:(?<!\d)\d{18}(?!\d)': 3
      "customs declaration": 2
      "DecMessage": 8
    not:
      "草稿": 8
      "черновик": 8
      "draft": 5
    xml_roots: [DecMessage, DecHead]
    headers: {decl_cn: 4, decl_elements: 2}
    filename:
      "报关单": 4
      're:(cn_?dec|customs.?dec)': 3
    formats: {xml: 1, pdf: 1, image: 1}
    id: ['(?:海关\s*编号|EntryId|declaration\s*no\.?)\s*[:：]?\s*(\d{18})', '(?<![\d/])(\d{18})(?![\d/])']

  draft:
