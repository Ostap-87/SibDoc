# ================================================================
#  ИЗВЛЕЧЕНИЕ ПОЛЕЙ И ОГРАНИЧЕНИЯ ПАКЕТНОЙ ЗАГРУЗКИ (SibDoc 3)
#
#  Поля называются именами единого словаря (config/fields.yaml): подпись
#  в документе («38. Вес нетто», «净重», «Net weight, kg») находится по
#  синонимам словаря. Новая подпись = новый синоним в fields.yaml.
#
#  Уверенность поля (0…1): XML и ячейка таблицы — 1.0; строка «подпись:
#  значение» из текстового слоя — 0.95; из OCR — 0.95 × уверенность
#  Tesseract в этой строке; найдено шаблоном — 0.85 × …; значение не
#  прошло проверку формата (контрольная цифра контейнера, длина кода) —
#  ещё × 0.6.
# ================================================================

field_review_below: 0.75        # поля с уверенностью ниже — на лист «Требует проверки»

# Дополнительные подписи только для пакетной загрузки (к синонимам config/fields.yaml)
extra_synonyms:
  total_value: ["Сумма", "Сумма, CNY", "Сумма, USD", "Amount, CNY", "Amount, USD", "金额", "总金额"]
  unit_price: ["Unit price", "Цена за т", "Цена за тонну", "Price per t", "Price, CNY/t", "单价(元/吨)"]
  qty: ["Кол-во, т", "Количество, т", "Quantity, t"]

# Подписи, которые в словаре относятся к выгрузке SAP («Цена» = цена SAP), в остальных
# документах означают обычные поля: «Цена» в инвойсе и декларации — цена за единицу.
remap:
  default: {sap_price: unit_price, sap_currency: currency, sap_incoterms: incoterms}
  system_export: {}

# Поля товарной строки (остальные — шапка документа)
item_fields: [item_no, hs_code, product_name, model, decl_elements, origin_country, qty, unit,
              net_weight, gross_weight, unit_price, total_value, customs_value, statistical_value,
              material, sap_price]

# Начало блока товара в тексте (номер — группа 1). Строки до следующего
# такого маркера — поля этого товара.
item_markers:
  - '^\s*(?:32\s*[.)]?\s*)?товар\s*№?\s*(\d{1,3})\b'
  - '^\s*(?:позиция|поз\.)\s*№?\s*(\d{1,3})\b'
  - '^\s*item\s*(?:no\.?|№|#)?\s*(\d{1,3})\b'
  - '^\s*项\s*号\s*[:：]?\s*(\d{1,3})\b'

# Строка «итого» в таблице: значения из неё — итоги документа, а не товар
totals_markers: ['итого', 'всего', 'total', '合计', '总计']

# Без каких полей документ отправляется «на проверку»
key_fields:
  ru_dt: [decl_ru, hs_code, net_weight]
  cn_dec: [decl_cn, hs_code, net_weight]
  draft: [hs_code, net_weight]

# Ограничения: пакет не должен «положить» сервер
limits:
  max_files: 500                # файлов в одном пакете (с учётом вложенных)
  max_total_mb: 500             # распакованный объём
  max_zip_depth: 4              # вложенность архивов
  max_pages: 300                # страниц в одном PDF / TIFF
  max_ocr_pages: 150            # страниц OCR на пакет
  max_sheet_rows: 20000         # строк на лист Excel
  ocr_dpi: 300                  # разрешение рендера PDF-страницы для OCR
  preview_dpi: 80               # картинки страниц для просмотра (0 — не сохранять)
  libreoffice_timeout_sec: 120  # конвертация .doc / .rtf / .odt / .ods
